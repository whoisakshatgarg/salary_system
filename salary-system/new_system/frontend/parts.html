<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parts &amp; Pricing — APEX THERMOCON</title>
  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { 600: "#1d4ed8", 700: "#1e40af" } } } } };
  </script>
  <script defer src="parts.js"></script>
  <script defer src="vendor/alpine.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    input, select, textarea { @apply outline-none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800" x-data="pt()" x-init="boot()" x-cloak>

  <div x-show="toast.show" x-transition
       class="fixed top-4 right-4 z-[70] px-4 py-3 rounded-lg shadow-lg text-white text-sm"
       :class="toast.kind === 'err' ? 'bg-rose-600' : 'bg-emerald-600'" x-text="toast.msg"></div>

  <div x-show="booted && authed" class="min-h-screen flex flex-col">
    <header class="bg-slate-900 text-slate-300 px-6 py-3 flex items-center gap-4 shrink-0">
      <div>
        <div class="text-white font-bold leading-tight">Parts &amp; Pricing</div>
        <div class="text-[11px] text-slate-400">APEX THERMOCON · drawing master &amp; rate history</div>
      </div>
      <div class="ml-auto flex items-center gap-4 text-xs text-slate-400">
        <a href="/" class="text-slate-300 hover:text-white font-medium">⌂ All modules</a>
        <span>Signed in as <span class="text-white" x-text="user?.username"></span></span>
      </div>
    </header>

    <main class="flex-1 overflow-auto p-6 max-w-6xl w-full mx-auto">
      <div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex flex-wrap items-end gap-3">
        <div class="flex-1 min-w-[220px]">
          <label class="block text-xs font-medium text-slate-500 mb-1">Search</label>
          <input x-model="q" @input.debounce.400ms="load()"
                 placeholder="Drawing no / description / grade / customer"
                 class="w-full border rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Customer</label>
          <select x-model="customerId" @change="load()" class="border rounded-lg px-2 py-2 text-sm">
            <option value="">All</option>
            <template x-for="c in lists.customers" :key="c.id">
              <option :value="c.id" x-text="c.name"></option>
            </template>
          </select>
        </div>
        <button @click="newDrawing()"
                class="ml-auto bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
          + New drawing
        </button>
      </div>

      <div class="bg-white rounded-xl shadow-sm overflow-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-xs text-slate-500 border-b bg-slate-50">
              <th class="px-4 py-3">Drawing no.</th>
              <th class="px-3 py-3">Rev</th>
              <th class="px-3 py-3">Customer</th>
              <th class="px-3 py-3">Description</th>
              <th class="px-3 py-3">Material</th>
              <th class="px-3 py-3">Unit</th>
              <th class="px-3 py-3 text-right">Latest rate</th>
              <th class="px-3 py-3 text-right">Files</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="d in rows" :key="d.id">
              <tr @click="open(d.id)" class="border-b last:border-0 hover:bg-brand-600/5 cursor-pointer"
                  :class="!d.active && 'opacity-50'">
                <td class="px-4 py-2.5 font-semibold text-brand-700" x-text="d.drawing_no"></td>
                <td class="px-3 py-2.5" x-text="d.revision"></td>
                <td class="px-3 py-2.5" x-text="d.customer_name || '—'"></td>
                <td class="px-3 py-2.5 text-slate-500" x-text="d.description || '—'"></td>
                <td class="px-3 py-2.5" x-text="[d.material_class, d.grade].filter(Boolean).join(' · ') || '—'"></td>
                <td class="px-3 py-2.5" x-text="d.unit"></td>
                <td class="px-3 py-2.5 text-right whitespace-nowrap">
                  <span x-show="d.latest_rate" class="font-medium" x-text="money(d.latest_rate)"></span>
                  <span x-show="d.latest_rate" class="text-[10px] uppercase ml-1 px-1.5 py-0.5 rounded-full"
                        :class="kindClass(d.latest_rate_kind)" x-text="d.latest_rate_kind"></span>
                  <span x-show="!d.latest_rate" class="text-slate-400">—</span>
                </td>
                <td class="px-3 py-2.5 text-right" x-text="d.files"></td>
              </tr>
            </template>
            <tr x-show="!rows.length">
              <td colspan="8" class="px-4 py-10 text-center text-slate-400">
                No drawings match — add the first with “+ New drawing”.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- ============================= DETAIL ============================= -->
  <template x-if="detail">
  <div class="fixed inset-0 z-40 bg-slate-900/50 flex items-start justify-center p-4 overflow-auto">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl my-4">
      <div class="flex items-center gap-3 px-6 py-4 border-b">
        <div>
          <div class="text-xl font-bold">
            <span x-text="detail.drawing_no"></span>
            <span class="text-slate-400 font-normal text-base" x-text="' rev ' + detail.revision"></span>
          </div>
          <div class="text-xs text-slate-500"
               x-text="[detail.customer_name, detail.description].filter(Boolean).join(' · ')"></div>
        </div>
        <template x-for="r in detail.revisions" :key="r.id">
          <button @click="openRevision(r)"
                  class="px-2 py-0.5 rounded-full text-xs font-medium border"
                  :class="r.id === detail.id ? 'bg-brand-600 text-white border-brand-600' : 'border-slate-300 text-slate-500 hover:bg-slate-50'"
                  x-text="r.revision"></button>
        </template>
        <div class="ml-auto flex gap-2">
          <button @click="newRevision()" class="border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded-lg text-sm">+ Revision</button>
          <button @click="editDrawing()" class="border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded-lg text-sm">Edit</button>
          <button @click="removeDrawing()" class="border border-rose-200 text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-lg text-sm">Delete</button>
          <button @click="closeDetail()" class="text-slate-400 hover:text-slate-600 px-2 text-xl leading-none">✕</button>
        </div>
      </div>

      <div class="p-6 grid grid-cols-2 gap-6">
        <!-- Left: facts + files + rate history -->
        <div class="space-y-5">
          <div class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
            <div class="text-slate-500">Material</div>
            <div x-text="[detail.material_class, detail.grade].filter(Boolean).join(' · ') || '—'"></div>
            <div class="text-slate-500">Unit</div><div x-text="detail.unit"></div>
            <div class="text-slate-500" x-show="detail.notes">Notes</div>
            <div x-show="detail.notes" x-text="detail.notes"></div>
          </div>

          <div>
            <div class="font-semibold text-sm mb-2">Drawing files</div>
            <template x-for="f in detail.files" :key="f.id">
              <div class="flex items-center gap-2 text-sm py-1">
                <button @click="viewFile(f)" class="text-brand-700 hover:underline truncate max-w-[220px] text-left"
                        x-text="f.filename"></button>
                <button @click="removeFile(f)" class="text-slate-300 hover:text-rose-600 text-xs" title="Delete">✕</button>
              </div>
            </template>
            <p x-show="!detail.files.length" class="text-xs text-slate-400">No files yet.</p>
            <label class="inline-block mt-2 cursor-pointer bg-slate-100 hover:bg-slate-200 rounded-lg px-3 py-1.5 text-xs font-medium">
              <span x-text="upload.busy ? 'Uploading…' : '+ Add files (PDF / scan)'"></span>
              <input type="file" multiple accept="image/*,application/pdf" class="hidden"
                     :disabled="upload.busy" @change="pickFiles($event)" />
            </label>
          </div>

          <div>
            <div class="flex items-center mb-2">
              <div class="font-semibold text-sm">Rate history</div>
              <button @click="newRate()" class="ml-auto text-sm text-brand-700 hover:underline">+ Record a rate</button>
            </div>
            <template x-if="rate">
            <div class="bg-slate-50 rounded-xl p-3 mb-2">
              <div class="flex gap-2">
                <select x-model="rate.kind" class="border rounded-lg px-2 py-1.5 text-sm bg-white">
                  <option value="quoted">Quoted</option>
                  <option value="agreed">Agreed</option>
                  <option value="revised">Revised</option>
                </select>
                <input type="number" step="0.01" min="0" x-model="rate.rate" placeholder="₹/piece"
                       class="border rounded-lg px-2 py-1.5 text-sm w-28 bg-white" />
                <input type="date" x-model="rate.rate_date" class="border rounded-lg px-2 py-1.5 text-sm bg-white" />
              </div>
              <div class="flex gap-2 mt-2">
                <input x-model="rate.note" placeholder="Note (optional)" class="flex-1 border rounded-lg px-2 py-1.5 text-sm bg-white" />
                <button @click="saveRate()" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-sm">Save</button>
              </div>
            </div>
            </template>
            <template x-for="r in detail.rates" :key="r.id">
              <div class="flex items-center gap-2 text-sm py-1.5 border-b last:border-0">
                <span class="text-[10px] uppercase px-1.5 py-0.5 rounded-full font-medium"
                      :class="kindClass(r.kind)" x-text="r.kind"></span>
                <b x-text="money(r.rate)"></b>
                <span class="text-xs text-slate-500" x-text="r.rate_date"></span>
                <span class="text-xs text-slate-400 truncate" x-text="r.note"></span>
                <button @click="removeRate(r)" class="ml-auto text-slate-300 hover:text-rose-600 text-xs">✕</button>
              </div>
            </template>
            <p x-show="!detail.rates.length" class="text-xs text-slate-400">
              Nothing yet — record what you quote and what gets agreed.
            </p>
          </div>
        </div>

        <!-- Right: costing builder -->
        <div>
          <div class="flex items-center mb-2">
            <div class="font-semibold text-sm">Costing (₹/piece build-up)</div>
            <button @click="newCosting()" class="ml-auto text-sm text-brand-700 hover:underline">+ New costing</button>
          </div>

          <template x-if="costing">
          <div class="bg-slate-50 rounded-xl p-3 mb-3">
            <template x-for="(op, i) in costing?.ops || []" :key="i">
              <div class="flex items-center gap-2 mb-1.5">
                <select x-model="op.operation" @change="opPicked(op)"
                        class="border rounded-lg px-2 py-1.5 text-sm bg-white flex-1">
                  <option value="">Operation…</option>
                  <template x-for="o in lists.operations" :key="o.id">
                    <option :value="o.name" x-text="o.name"></option>
                  </template>
                </select>
                <input type="number" min="0" step="0.5" x-model="op.minutes" placeholder="min"
                       class="border rounded-lg px-2 py-1.5 text-sm w-20 bg-white" title="Minutes per piece" />
                <input type="number" min="0" x-model="op.rate_per_hour" placeholder="₹/hr"
                       class="border rounded-lg px-2 py-1.5 text-sm w-24 bg-white" />
                <span class="text-xs text-slate-500 w-16 text-right" x-text="'₹' + opCost(op)"></span>
                <button @click="removeOp(i)" class="text-slate-300 hover:text-rose-600">✕</button>
              </div>
            </template>
            <button @click="addOp()" class="text-xs text-brand-700 hover:underline mb-2">+ Add operation</button>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <div><label class="block text-[11px] text-slate-500 mb-0.5">Material cost (₹/piece)</label>
                <input type="number" min="0" step="0.01" x-model="costing.material_cost"
                       class="border rounded-lg px-2 py-1.5 text-sm w-full bg-white" /></div>
              <div><label class="block text-[11px] text-slate-500 mb-0.5">Margin %</label>
                <input type="number" min="0" step="0.5" x-model="costing.margin_pct"
                       class="border rounded-lg px-2 py-1.5 text-sm w-full bg-white" /></div>
            </div>
            <input x-model="costing.notes" placeholder="Notes (optional)"
                   class="border rounded-lg px-2 py-1.5 text-sm w-full bg-white mb-2" />
            <div class="flex items-center text-sm">
              <div class="text-slate-500">
                Ops <b x-text="'₹' + costingTotals.ops"></b> · with material
                <b x-text="'₹' + costingTotals.subtotal"></b> · <span class="text-slate-800 font-bold"
                x-text="'Total ₹' + costingTotals.total + ' /piece'"></span>
              </div>
              <button @click="saveCosting()"
                      class="ml-auto bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-sm">Save costing</button>
            </div>
          </div>
          </template>

          <template x-for="c in detail.costings" :key="c.id">
            <div class="border border-slate-200 rounded-xl p-3 mb-2 text-sm">
              <div class="flex items-center">
                <b x-text="'₹' + c.total + ' /piece'"></b>
                <span class="text-xs text-slate-400 ml-2" x-text="c.created_at.slice(0, 10)"></span>
                <div class="ml-auto flex gap-2">
                  <button @click="costingToRate(c, 'quoted')" class="text-xs text-sky-700 hover:underline">→ quote</button>
                  <button @click="costingToRate(c, 'agreed')" class="text-xs text-emerald-700 hover:underline">→ agreed</button>
                  <button @click="removeCosting(c)" class="text-slate-300 hover:text-rose-600 text-xs">✕</button>
                </div>
              </div>
              <div class="text-xs text-slate-500 mt-1">
                <template x-for="o in c.ops" :key="o.id">
                  <span class="inline-block mr-2" x-text="o.operation + ' ' + o.minutes + 'min ₹' + o.cost"></span>
                </template>
                <span x-show="c.material_cost" x-text="'· material ₹' + c.material_cost"></span>
                <span x-show="c.margin_pct" x-text="' · margin ' + c.margin_pct + '%'"></span>
              </div>
              <div x-show="c.notes" class="text-xs text-slate-400 mt-0.5" x-text="c.notes"></div>
            </div>
          </template>
          <p x-show="!detail.costings.length && !costing" class="text-xs text-slate-400">
            Build a costing from operations + material, then record it into the rate history.
          </p>
        </div>
      </div>
    </div>
  </div>
  </template>

  <!-- ============================= FORM ============================= -->
  <template x-if="form">
  <div class="fixed inset-0 z-50 bg-slate-900/50 flex items-start justify-center p-4 overflow-auto">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg my-10">
      <div class="px-6 py-4 border-b flex items-center">
        <div class="text-lg font-bold" x-text="form.id ? 'Edit ' + form.drawing_no : 'New drawing'"></div>
        <button @click="form = null" class="ml-auto text-slate-400 hover:text-slate-600 px-2 text-xl leading-none">✕</button>
      </div>
      <form @submit.prevent="saveDrawing()" class="p-6 space-y-3 text-sm">
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2"><label class="block text-xs text-slate-500 mb-1">Drawing number *</label>
            <input x-model="form.drawing_no" class="border rounded-lg px-3 py-2 w-full font-mono" /></div>
          <div><label class="block text-xs text-slate-500 mb-1">Revision</label>
            <input x-model="form.revision" class="border rounded-lg px-3 py-2 w-full" /></div>
        </div>
        <div><label class="block text-xs text-slate-500 mb-1">Customer</label>
          <select x-model="form.customer_id" class="border rounded-lg px-3 py-2 w-full">
            <option value="">—</option>
            <template x-for="c in lists.customers" :key="c.id">
              <option :value="c.id" x-text="c.name"></option>
            </template>
          </select></div>
        <div><label class="block text-xs text-slate-500 mb-1">Description</label>
          <input x-model="form.description" placeholder="e.g. Pump shaft, stage 2" class="border rounded-lg px-3 py-2 w-full" /></div>
        <div class="grid grid-cols-3 gap-3">
          <div><label class="block text-xs text-slate-500 mb-1">Material class</label>
            <input x-model="form.material_class" placeholder="Steel…" class="border rounded-lg px-3 py-2 w-full" /></div>
          <div><label class="block text-xs text-slate-500 mb-1">Grade</label>
            <input x-model="form.grade" placeholder="EN8…" class="border rounded-lg px-3 py-2 w-full" /></div>
          <div><label class="block text-xs text-slate-500 mb-1">Unit</label>
            <input x-model="form.unit" list="unitlist" class="border rounded-lg px-3 py-2 w-full" />
            <datalist id="unitlist">
              <template x-for="u in lists.units" :key="u"><option :value="u"></option></template>
            </datalist></div>
        </div>
        <div><label class="block text-xs text-slate-500 mb-1">Notes</label>
          <textarea x-model="form.notes" rows="2" class="border rounded-lg px-3 py-2 w-full"></textarea></div>
        <p x-show="formError" x-text="formError" class="text-rose-600 text-sm"></p>
        <div class="flex gap-3 pt-1">
          <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg">Save</button>
          <button type="button" @click="form = null"
                  class="flex-1 border border-slate-300 hover:bg-slate-50 text-slate-600 py-2.5 rounded-lg">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  </template>

</body>
</html>
