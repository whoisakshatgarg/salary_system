<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEX THERMOCON — Workshop</title>
  <link rel="icon" type="image/png" href="/assets/logo-mark.png" />
  <!-- Vendored locally so the app works fully offline (no CDN needed). -->
  <script src="/vendor/tailwind.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: {
      50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6",
      600: "#1d4ed8", 700: "#1e40af", 800: "#1e3a8a" } } } } };
  </script>
  <script defer src="shell/shell.js"></script>
  <script defer src="/vendor/alpine.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    input, select, textarea { outline: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800" x-data="shell()" x-init="boot()" x-cloak>

  <!-- Toast -->
  <div x-show="toast.show" x-transition
       class="fixed top-4 right-4 z-[70] px-4 py-2.5 rounded-xl shadow-lg text-white text-sm font-medium ring-1 ring-inset ring-white/15"
       :class="toast.kind === 'err' ? 'bg-rose-600' : 'bg-emerald-600'"
       x-text="toast.msg"></div>

  <!-- ====================== UPDATE-AVAILABLE POPUP ====================== -->
  <div x-show="upd.show" x-cloak
       class="fixed inset-0 z-[60] bg-slate-900/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-md p-6">
      <template x-if="!upd.done">
        <div>
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-700 ring-1 ring-inset ring-brand-600/10 flex items-center justify-center text-xl shrink-0">⬆</div>
            <div class="min-w-0">
              <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Update</div>
              <div class="text-base font-bold text-slate-900">
                <span x-text="'v' + (upd.info?.latest || '')"></span> available
              </div>
            </div>
            <span class="ml-auto font-mono text-xs text-slate-400 whitespace-nowrap shrink-0"
                  x-text="'now v' + (upd.info?.current || '')"></span>
          </div>
          <p x-show="upd.info && !upd.info.can_apply"
             class="text-xs text-amber-800 bg-amber-50 ring-1 ring-inset ring-amber-600/20 rounded-lg px-3 py-2 mb-3">
            This copy can't update itself — the installed Windows app can.
          </p>
          <p class="text-xs text-slate-400 mb-4">Your data lives outside the app and is untouched.</p>
          <div class="flex gap-3">
            <button @click="applyUpdate()" :disabled="upd.busy || !upd.info?.can_apply"
                    class="flex-1 bg-brand-600 hover:bg-brand-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-2.5 rounded-lg shadow-sm text-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600/40"
                    x-text="upd.busy ? 'Downloading…' : 'Update now'"></button>
            <button @click="upd.show = false" :disabled="upd.busy"
                    class="flex-1 border border-slate-300 bg-white hover:bg-slate-50 disabled:opacity-50 text-slate-700 font-medium py-2.5 rounded-lg shadow-sm text-sm transition-colors">
              Not now
            </button>
          </div>
        </div>
      </template>
      <template x-if="upd.done">
        <div class="text-center py-4">
          <div class="text-3xl mb-2">✅</div>
          <div class="text-lg font-bold text-slate-900 mb-1">Update downloaded</div>
          <p class="text-sm text-slate-500">
            Closing and reopening with the new version.<br />
            If it doesn't come back in ~15 seconds, double-click it again.
          </p>
        </div>
      </template>
    </div>
  </div>

  <!-- ============================= LOGIN ============================= -->
  <div x-show="booted && !user"
       class="min-h-screen flex items-center justify-center p-4
              bg-[radial-gradient(60rem_38rem_at_50%_-6%,#e2e8f0_0%,transparent_70%)]">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl w-full max-w-md px-8 py-9">
      <!-- the company mark carries the name; keep only the role line under it -->
      <div class="text-center mb-7">
        <img src="/assets/logo-full.png" alt="APEX THERMOCON"
             class="mx-auto w-64 max-w-full" />
        <div class="mx-auto mt-2 h-px w-14 bg-brand-600"></div>
        <div class="mt-3.5 text-[10px] uppercase tracking-[0.22em] text-slate-400 font-semibold">Workshop Management</div>
      </div>
      <template x-if="edition !== 'operator'">
        <form @submit.prevent="doLogin()" class="space-y-4">
          <div>
            <label class="block text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-1.5">Username</label>
            <input x-model="login.username" type="text" autocomplete="username"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm bg-white
                          focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
          </div>
          <div>
            <label class="block text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-1.5">Password</label>
            <input x-model="login.password" type="password" autocomplete="current-password"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm bg-white
                          focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
          </div>
          <p x-show="loginError" x-text="loginError"
             class="text-rose-700 text-xs bg-rose-50 ring-1 ring-inset ring-rose-600/20 rounded-lg px-3 py-2"></p>
          <button class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg shadow-sm
                         text-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600/40">
            Sign in
          </button>
        </form>
      </template>
      <template x-if="edition === 'operator'">
        <div class="text-center">
          <p x-show="loginError" x-text="loginError"
             class="text-rose-700 text-xs bg-rose-50 ring-1 ring-inset ring-rose-600/20 rounded-lg px-3 py-2 mb-3"></p>
          <button @click="kioskRetry()"
                  class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg shadow-sm
                         text-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600/40">
            Start
          </button>
        </div>
      </template>
      <p class="font-mono text-[11px] text-slate-300 mt-6 text-center" x-show="version"
         x-text="'v' + version"></p>
    </div>
  </div>

  <!-- ============================= SHELL ============================= -->
  <div x-show="user" class="min-h-screen flex flex-col">
    <header class="bg-slate-900 text-slate-300 px-6 py-3 flex items-center gap-4 shrink-0">
      <button @click="view = 'home'" class="text-left group flex items-center gap-3">
        <img src="/assets/logo-mark.png" alt="APEX logo"
             class="w-9 h-9 rounded-lg bg-white ring-1 ring-white/15 shrink-0" />
        <span>
          <span class="block text-white font-bold uppercase tracking-[0.16em] text-sm leading-tight group-hover:text-brand-100 transition-colors">Apex Thermocon</span>
          <span class="block text-[10px] uppercase tracking-[0.18em] text-slate-500 mt-0.5">Workshop Management</span>
        </span>
      </button>
      <div class="ml-auto flex items-center gap-4 text-xs text-slate-400">
        <button @click="checkUpdates(true)" title="Check for updates"
                class="font-mono hover:text-slate-200 transition-colors" x-text="version ? 'v' + version : ''"></button>
        <span>Signed in as <span class="text-white font-medium" x-text="user?.username"></span></span>
        <button @click="logout()" class="text-slate-400 hover:text-rose-400 font-medium transition-colors">Logout</button>
      </div>
    </header>

    <main class="flex-1 overflow-auto p-8 max-w-6xl w-full mx-auto">

      <!-- ============ HOME: one tile per granted module ============ -->
      <section x-show="view === 'home'">
        <h1 class="text-2xl font-bold text-slate-900 mb-5">Home</h1>
        <div x-show="homeError" class="bg-rose-50 border border-rose-200 text-rose-700 rounded-xl px-4 py-3 mb-4 text-sm flex items-center gap-3">
          <span x-text="homeError"></span>
          <button @click="enter()" class="ml-auto bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow-sm transition-colors">Try again</button>
        </div>
        <div x-show="data && !isAdmin && !grantedModules.length"
             class="rounded-xl border border-slate-200 bg-white shadow-sm p-8 text-center text-slate-500 text-sm mb-4">
          <div class="text-2xl text-slate-300 mb-2">🔒</div>
          No modules granted yet — ask the owner for access in <b class="text-slate-700">Users &amp; Access</b>.
        </div>
        <div class="grid grid-cols-3 gap-4">
          <template x-for="m in grantedModules" :key="m.key">
            <!-- a real <a> when the module is built, so right-click / middle-click
                 "open in new tab" works like anywhere else in a browser -->
            <a :href="m.built && m.path ? m.path : null" @click.prevent="open(m)"
               class="rounded-xl border border-slate-200 bg-white shadow-sm p-5 text-left flex flex-col min-h-[128px] no-underline cursor-pointer
                      hover:shadow-md hover:-translate-y-0.5 hover:border-slate-300 transition-all">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-brand-50 text-brand-700 ring-1 ring-inset ring-brand-600/10 flex items-center justify-center text-2xl shrink-0"
                     x-text="m.icon"></div>
                <div class="font-semibold text-slate-900 leading-tight" x-text="m.label"></div>
                <span x-show="!m.built"
                      class="ml-auto shrink-0 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-medium
                             bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-600/20">
                  <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Planned
                </span>
              </div>
              <p class="text-[13px] leading-snug text-slate-500 mt-3" x-text="m.desc"></p>
            </a>
          </template>
          <!-- Admin-only: account management -->
          <button x-show="isAdmin" @click="openUsers()"
                  class="rounded-xl border border-slate-200 bg-white shadow-sm p-5 text-left flex flex-col min-h-[128px]
                         hover:shadow-md hover:-translate-y-0.5 hover:border-slate-300 transition-all">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl bg-slate-100 text-slate-600 ring-1 ring-inset ring-slate-900/5 flex items-center justify-center text-2xl shrink-0">🔑</div>
              <div class="font-semibold text-slate-900 leading-tight">Users &amp; Access</div>
            </div>
            <p class="text-[13px] leading-snug text-slate-500 mt-3">Accounts and module permissions</p>
          </button>

          <!-- Not a module (no grant, no registry entry) — just the manual,
               and OWNER-ONLY: the server refuses /help/ to anyone else, so this
               tile is hidden to match rather than offering a dead end. -->
          <a x-show="isAdmin" href="/help/"
             class="rounded-xl border border-slate-200 bg-white shadow-sm p-5 text-left flex flex-col min-h-[128px] no-underline
                    hover:shadow-md hover:-translate-y-0.5 hover:border-slate-300 transition-all">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl bg-slate-100 text-slate-600 ring-1 ring-inset ring-slate-900/5 flex items-center justify-center text-2xl shrink-0">📖</div>
              <div class="font-semibold text-slate-900 leading-tight">User Guide</div>
            </div>
            <p class="text-[13px] leading-snug text-slate-500 mt-3">Every screen, step by step</p>
          </a>
        </div>

        <!-- ================= DEADLINES DUE SOON =================
             Bottom-left of Home, under the tiles. Only appears when there is
             something to warn about, and only for accounts that can see orders
             (the fetch simply fails closed for anyone else). -->
        <template x-if="dueSoon && (dueSoon.overdue.length || dueSoon.this_week.length || dueSoon.this_month.length)">
          <div class="mt-8">
            <div class="flex items-center mb-3">
              <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Deadlines</div>
              <button @click="loadDueSoon()"
                      class="ml-auto text-xs text-slate-400 hover:text-brand-700 transition-colors">Refresh</button>
            </div>
            <div class="grid grid-cols-3 gap-4 items-start">

              <!-- Overdue -->
              <div class="rounded-xl border border-slate-200 border-l-4 border-l-rose-500 bg-white shadow-sm overflow-hidden">
                <div class="flex items-center px-4 py-2.5 bg-slate-50 border-b-2 border-slate-200">
                  <span class="text-[11px] uppercase tracking-wider font-semibold text-slate-500">Overdue</span>
                  <span class="ml-auto text-[11px] tabular-nums font-semibold"
                        :class="dueSoon.overdue.length ? 'text-rose-600' : 'text-slate-300'"
                        x-text="dueSoon.overdue.length"></span>
                </div>
                <div class="divide-y divide-slate-100">
                  <template x-for="o in dueSoon.overdue" :key="o.id">
                    <a :href="'/orders/?open=' + o.id" title="Open this order"
                       class="block px-4 py-2 hover:bg-brand-50/60 transition-colors cursor-pointer">
                      <div class="flex items-center gap-2">
                        <span class="font-mono text-xs font-semibold text-brand-700 shrink-0" x-text="o.order_no"></span>
                        <span class="text-sm text-slate-800 truncate min-w-0" x-text="o.customer_name"></span>
                        <span class="ml-auto shrink-0 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium tabular-nums
                                     bg-rose-50 text-rose-700 ring-1 ring-inset ring-rose-600/20 whitespace-nowrap">
                          <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span><span x-text="(-o.days_left) + 'd late'"></span>
                        </span>
                      </div>
                      <div class="text-[11px] text-slate-400 tabular-nums mt-0.5" x-text="o.qty_pending + ' left'"></div>
                    </a>
                  </template>
                  <div x-show="!dueSoon.overdue.length" class="px-4 py-3 text-xs text-slate-300">Nothing overdue</div>
                </div>
              </div>

              <!-- Next 7 days -->
              <div class="rounded-xl border border-slate-200 border-l-4 border-l-amber-500 bg-white shadow-sm overflow-hidden">
                <div class="flex items-center px-4 py-2.5 bg-slate-50 border-b-2 border-slate-200">
                  <span class="text-[11px] uppercase tracking-wider font-semibold text-slate-500">Next 7 days</span>
                  <span class="ml-auto text-[11px] tabular-nums font-semibold"
                        :class="dueSoon.this_week.length ? 'text-amber-600' : 'text-slate-300'"
                        x-text="dueSoon.this_week.length"></span>
                </div>
                <div class="divide-y divide-slate-100">
                  <template x-for="o in dueSoon.this_week" :key="o.id">
                    <a :href="'/orders/?open=' + o.id" title="Open this order"
                       class="block px-4 py-2 hover:bg-brand-50/60 transition-colors cursor-pointer">
                      <div class="flex items-center gap-2">
                        <span class="font-mono text-xs font-semibold text-brand-700 shrink-0" x-text="o.order_no"></span>
                        <span class="text-sm text-slate-800 truncate min-w-0" x-text="o.customer_name"></span>
                        <span class="ml-auto shrink-0 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium tabular-nums
                                     bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-600/20 whitespace-nowrap">
                          <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span><span x-text="o.days_left === 0 ? 'today' : ('in ' + o.days_left + 'd')"></span>
                        </span>
                      </div>
                      <div class="text-[11px] text-slate-400 tabular-nums mt-0.5" x-text="o.qty_pending + ' left'"></div>
                    </a>
                  </template>
                  <div x-show="!dueSoon.this_week.length" class="px-4 py-3 text-xs text-slate-300">Nothing due</div>
                </div>
              </div>

              <!-- Next 31 days -->
              <div class="rounded-xl border border-slate-200 border-l-4 border-l-slate-400 bg-white shadow-sm overflow-hidden">
                <div class="flex items-center px-4 py-2.5 bg-slate-50 border-b-2 border-slate-200">
                  <span class="text-[11px] uppercase tracking-wider font-semibold text-slate-500">Next 31 days</span>
                  <span class="ml-auto text-[11px] tabular-nums font-semibold"
                        :class="dueSoon.this_month.length ? 'text-slate-600' : 'text-slate-300'"
                        x-text="dueSoon.this_month.length"></span>
                </div>
                <div class="divide-y divide-slate-100">
                  <template x-for="o in dueSoon.this_month" :key="o.id">
                    <a :href="'/orders/?open=' + o.id" title="Open this order"
                       class="block px-4 py-2 hover:bg-brand-50/60 transition-colors cursor-pointer">
                      <div class="flex items-center gap-2">
                        <span class="font-mono text-xs font-semibold text-brand-700 shrink-0" x-text="o.order_no"></span>
                        <span class="text-sm text-slate-800 truncate min-w-0" x-text="o.customer_name"></span>
                        <span class="ml-auto shrink-0 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium tabular-nums
                                     bg-slate-100 text-slate-600 ring-1 ring-inset ring-slate-900/10 whitespace-nowrap">
                          <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span><span x-text="'in ' + o.days_left + 'd'"></span>
                        </span>
                      </div>
                      <div class="text-[11px] text-slate-400 tabular-nums mt-0.5" x-text="o.qty_pending + ' left'"></div>
                    </a>
                  </template>
                  <div x-show="!dueSoon.this_month.length" class="px-4 py-3 text-xs text-slate-300">Nothing due</div>
                </div>
              </div>

            </div>
          </div>
        </template>
      </section>

      <!-- ============ PLACEHOLDER for unbuilt modules ============ -->
      <section x-show="view === 'ph'">
        <template x-if="ph">
          <div class="max-w-xl mx-auto text-center rounded-2xl border border-slate-200 bg-white shadow-sm p-10 mt-10">
            <div class="text-5xl mb-4" x-text="ph.icon"></div>
            <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-medium
                        bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-600/20 mb-3">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Planned
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2" x-text="ph.label"></h1>
            <p class="text-sm text-slate-500 mb-1" x-text="ph.desc"></p>
            <p class="text-xs text-slate-400 mb-6">This tile opens the real screen once it ships.</p>
            <button @click="view = 'home'"
                    class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-5 py-2 rounded-lg shadow-sm text-sm
                           transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600/40">
              ← Back to Home
            </button>
          </div>
        </template>
      </section>

      <!-- ============ USERS & ACCESS (admin) ============ -->
      <section x-show="view === 'users'">
        <div class="flex items-end mb-5">
          <div>
            <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Administration</div>
            <h1 class="text-2xl font-bold text-slate-900 leading-tight">Users &amp; Access</h1>
          </div>
          <div class="ml-auto flex gap-2">
            <button @click="view = 'home'"
                    class="border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 rounded-lg px-3 py-2 text-sm font-medium shadow-sm transition-colors">← Home</button>
            <button @click="newUser()"
                    class="bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg shadow-sm px-4 py-2 text-sm
                           transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600/40">+ Add account</button>
          </div>
        </div>
        <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 border-b-2 border-slate-200">
                <tr class="text-left text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                  <th class="px-4 py-2.5">Account</th>
                  <th class="px-3 py-2.5">Type</th>
                  <th class="px-3 py-2.5">Can open</th>
                  <th class="px-3 py-2.5 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <!-- zebra is odd: not even: — the x-for <template> is itself
                     nth-child(1) of the tbody, so it shifts the count by one. -->
                <template x-for="u in users" :key="u.id">
                  <tr class="odd:bg-slate-50/60 hover:bg-brand-50/60 transition-colors">
                    <td class="px-4 py-2.5 font-semibold text-slate-900" x-text="u.username"></td>
                    <td class="px-3 py-2.5">
                      <span x-show="u.role === 'admin'"
                            class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium
                                   bg-brand-50 text-brand-700 ring-1 ring-inset ring-brand-600/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-brand-500"></span>Administrator
                      </span>
                      <span x-show="u.role !== 'admin'" class="inline-flex items-center gap-1.5 text-xs text-slate-500">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>Staff
                      </span>
                    </td>
                    <td class="px-3 py-2.5">
                      <span x-show="u.role === 'admin'" class="text-xs text-slate-400">every module</span>
                      <div x-show="u.role !== 'admin'" class="flex flex-wrap gap-1">
                        <template x-for="g in u.grants" :key="g">
                          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium
                                       bg-slate-100 text-slate-600 ring-1 ring-inset ring-slate-900/5"
                                x-text="(data?.modules.find(m => m.key === g) || {label: g}).label"></span>
                        </template>
                        <span x-show="!u.grants.length" class="text-xs text-slate-300">nothing yet</span>
                      </div>
                    </td>
                    <td class="px-3 py-2.5 text-right whitespace-nowrap">
                      <button @click="editUser(u)" class="text-brand-700 hover:underline text-sm font-medium">Edit</button>
                      <span class="text-slate-200 mx-2">·</span>
                      <button @click="deleteUser(u)" class="text-slate-400 hover:text-rose-600 text-sm transition-colors" title="Delete account">Delete</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="px-4 py-2 border-t border-slate-100 bg-slate-50/60 text-xs text-slate-400">
            <span class="tabular-nums" x-text="users.length"></span> accounts
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ============ ACCOUNT FORM (add / edit) ============ -->
  <template x-if="uform">
    <div class="fixed inset-0 z-50 bg-slate-900/50 flex items-start justify-center p-4 overflow-auto">
      <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-md my-10">
        <div class="px-6 py-4 border-b border-slate-200 flex items-center">
          <div>
            <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Account</div>
            <div class="text-base font-bold text-slate-900 leading-tight"
                 x-text="uform.id ? uform.username : 'New account'"></div>
          </div>
          <button @click="uform = null"
                  class="ml-auto text-slate-300 hover:text-slate-600 px-2 text-xl leading-none transition-colors">✕</button>
        </div>
        <form @submit.prevent="saveUser()" class="p-6 space-y-4">
          <div x-show="!uform.id">
            <label class="block text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-1.5">Username</label>
            <input x-model="uform.username" placeholder="e.g. office"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white
                          focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
          </div>
          <div>
            <label class="block text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-1.5"
                   x-text="uform.id ? 'New password — blank keeps current' : 'Password'"></label>
            <input x-model="uform.password" type="password"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white
                          focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
          </div>
          <label class="flex items-center gap-2.5 text-sm text-slate-700 border border-slate-200 rounded-lg px-3 py-2.5
                        hover:bg-slate-50 transition-colors cursor-pointer">
            <input type="checkbox" class="accent-brand-600 w-4 h-4" :checked="uform.role === 'admin'"
                   @change="uform.role = $event.target.checked ? 'admin' : 'operator'" />
            <span><b class="font-semibold text-slate-900">Administrator</b> — full access</span>
          </label>
          <div x-show="uform.role !== 'admin'">
            <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-2">Can open</div>
            <div class="grid grid-cols-2 gap-2">
              <template x-for="m in (data?.modules || [])" :key="m.key">
                <label class="flex items-center gap-2 text-[13px] text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2
                              hover:bg-white hover:border-slate-300 transition-colors cursor-pointer">
                  <input type="checkbox" class="accent-brand-600 w-4 h-4 shrink-0"
                         :checked="uform.grants.includes(m.key)" @change="toggleGrant(m.key)" />
                  <span class="truncate" x-text="m.label"></span>
                </label>
              </template>
            </div>
          </div>
          <p x-show="uformError" x-text="uformError"
             class="text-rose-700 text-xs bg-rose-50 ring-1 ring-inset ring-rose-600/20 rounded-lg px-3 py-2"></p>
          <div class="flex gap-3 pt-1">
            <button type="submit"
                    class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg shadow-sm text-sm
                           transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600/40">Save account</button>
            <button type="button" @click="uform = null"
                    class="flex-1 border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-medium py-2.5 rounded-lg shadow-sm text-sm transition-colors">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </template>

</body>
</html>
