<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotations &amp; Invoices — APEX THERMOCON</title>
  <link rel="icon" type="image/png" href="/assets/logo-mark.png" />
  <script src="/vendor/tailwind.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: {
      50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6",
      600: "#1d4ed8", 700: "#1e40af", 800: "#1e3a8a" } } } } };
  </script>
  <script defer src="quotations.js"></script>
  <script defer src="/vendor/alpine.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    input, select, textarea { outline: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800" x-data="qi()" x-init="boot()" x-cloak>

  <div x-show="toast.show" x-transition
       class="fixed top-4 right-4 z-[70] px-4 py-3 rounded-lg shadow-lg text-white text-sm"
       :class="toast.kind === 'err' ? 'bg-rose-600' : 'bg-emerald-600'" x-text="toast.msg"></div>

  <div x-show="booted && authed" class="min-h-screen flex flex-col">
    <header class="bg-slate-900 text-slate-300 px-6 py-3 flex items-center gap-4 shrink-0">
      <a href="/" title="Back to all modules"
         class="flex items-center gap-1.5 shrink-0 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-lg px-3 py-2 text-sm font-medium transition-colors">
        <span class="text-base leading-none">⌂</span> Home
      </a>
      <img src="/assets/logo-mark.png" alt="APEX logo"
           class="w-9 h-9 rounded-lg bg-white ring-1 ring-white/15 shrink-0 -mr-1" />
      <div>
        <div class="text-[10px] uppercase tracking-[0.18em] text-slate-500 font-semibold leading-none">Apex Thermocon</div>
        <div class="text-white font-bold leading-tight mt-1">Quotations &amp; Invoices</div>
      </div>
      <div class="ml-auto flex items-center gap-4 text-xs text-slate-400">
        <span>Signed in as <span class="text-white" x-text="user?.username"></span></span>
      </div>
    </header>

    <main class="flex-1 overflow-auto p-6 max-w-6xl w-full mx-auto">

      <!-- ONE toolbar row: segmented view switch · search · new-document actions -->
      <div class="rounded-xl border border-slate-200 bg-white shadow-sm px-3 py-3 mb-4 flex flex-wrap items-center gap-3">
        <div class="inline-flex items-center gap-0.5 bg-white border border-slate-200 rounded-xl p-1 shadow-sm">
          <a href="?kind=all" @click.prevent="kind = ''; load()"
             class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors no-underline"
             :class="!kind ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'">
            All <span class="text-[11px] opacity-60"
                      x-text="(data.counts.quotation || 0) + (data.counts.invoice || 0)"></span>
          </a>
          <a href="?kind=quotation" @click.prevent="kind = 'quotation'; load()"
             class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors no-underline"
             :class="kind === 'quotation' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'">
            Quotations <span class="text-[11px] opacity-60" x-text="data.counts.quotation || 0"></span>
          </a>
          <a href="?kind=invoice" @click.prevent="kind = 'invoice'; load()"
             class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors no-underline"
             :class="kind === 'invoice' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'">
            Invoices <span class="text-[11px] opacity-60" x-text="data.counts.invoice || 0"></span>
          </a>
        </div>

        <div class="flex-1 min-w-[220px]">
          <label for="qi-search" class="sr-only">Search</label>
          <input id="qi-search" x-model="q" @input.debounce.400ms="load()"
                 placeholder="Number / customer / code / reference"
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white
                        focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
        </div>

        <button @click="newDoc('quotation')"
                class="border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 rounded-lg px-3 py-2 text-sm font-medium shadow-sm transition-colors">
          + Quotation
        </button>
        <button @click="newDoc('invoice')"
                class="bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg shadow-sm px-4 py-2 text-sm transition-colors
                       focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600/40">
          + Invoice
        </button>
      </div>

      <!-- the document instrument -->
      <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b-2 border-slate-200">
              <tr class="text-left text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                <th class="px-4 py-2.5">Number</th>
                <th class="px-3 py-2.5">Type</th>
                <th class="px-3 py-2.5">Date</th>
                <th class="px-3 py-2.5">Customer</th>
                <th class="px-3 py-2.5">Against order</th>
                <th class="px-3 py-2.5 text-right">Total</th>
                <th class="px-3 py-2.5">Status</th>
                <th class="px-3 py-2.5 text-right"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              <template x-for="d in data.rows" :key="d.id">
                <!-- a superseded document is history: it stays readable but
                     stops competing with the revision that replaced it -->
                <tr @click="open(d.id)"
                    class="even:bg-slate-50/60 hover:bg-brand-50/60 transition-colors cursor-pointer"
                    :class="d.superseded_by ? 'opacity-60' : ''">
                  <td class="px-4 py-2.5 font-mono text-xs font-semibold whitespace-nowrap"
                      :class="d.superseded_by ? 'text-slate-400' : 'text-brand-700'" x-text="d.doc_no"></td>
                  <td class="px-3 py-2.5">
                    <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap"
                          :class="kindClass(d.kind)">
                      <span class="w-1.5 h-1.5 rounded-full" :class="qiKindDot(d.kind)"></span>
                      <span x-text="kindLabel(d.kind)"></span>
                    </span>
                    <span x-show="d.superseded_by"
                          class="ml-1.5 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap
                                 bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-600/20">
                      <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>superseded
                    </span>
                  </td>
                  <td class="px-3 py-2.5 whitespace-nowrap tabular-nums text-slate-600" x-text="fmtDate(d.doc_date)"></td>
                  <td class="px-3 py-2.5">
                    <div class="font-medium text-slate-800 leading-tight" x-text="d.customer_name"></div>
                    <div x-show="d.customer_code" class="font-mono text-[11px] text-slate-400 leading-tight"
                         x-text="d.customer_code"></div>
                  </td>
                  <td class="px-3 py-2.5 font-mono text-xs whitespace-nowrap"
                      :class="d.order_no ? 'text-slate-500' : 'text-slate-300'" x-text="d.order_no || '—'"></td>
                  <td class="px-3 py-2.5 text-right tabular-nums font-semibold text-slate-900 whitespace-nowrap"
                      x-text="money(d.total, qiSym(d))"></td>
                  <td class="px-3 py-2.5">
                    <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium capitalize whitespace-nowrap"
                          :class="statusClass(d.status)">
                      <span class="w-1.5 h-1.5 rounded-full" :class="qiStatusDot(d.status)"></span>
                      <span x-text="d.status"></span>
                    </span>
                  </td>
                  <td class="px-3 py-2.5 text-right">
                    <button @click.stop="print(d)" title="Print / save as PDF"
                            class="inline-flex items-center gap-1 border border-slate-300 bg-white hover:bg-slate-50 text-slate-700
                                   rounded-lg px-2 py-1 text-xs font-medium shadow-sm transition-colors">
                      <span class="text-[11px] leading-none">🖨</span> Print
                    </button>
                  </td>
                </tr>
              </template>
              <tr x-show="!data.rows.length">
                <td colspan="8" class="px-4 py-14 text-center">
                  <div class="text-3xl text-slate-300 leading-none">🧾</div>
                  <div class="mt-2 text-sm text-slate-500">Nothing yet — raise a quotation, or an invoice straight from an order.</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="px-4 py-2.5 border-t border-slate-200 bg-slate-50 text-xs text-slate-400">
          <span x-text="qiPlural(data.rows.length, 'document', 'documents')"></span> shown ·
          <span x-text="qiPlural(data.counts.quotation, 'quotation', 'quotations')"></span> ·
          <span x-text="qiPlural(data.counts.invoice, 'invoice', 'invoices')"></span> on file
        </div>
      </div>
    </main>
  </div>

  <!-- ============================= DETAIL ============================= -->
  <template x-if="detail">
  <div class="fixed inset-0 z-40 bg-slate-900/50 flex items-start justify-center p-4 overflow-auto">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl my-4 overflow-hidden">
      <!-- title first, actions on their own row: six buttons and a document
           number do not fit on one line at this width -->
      <div class="flex flex-wrap items-start gap-3 px-6 py-4 border-b border-slate-200">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xl font-bold font-mono text-slate-900 leading-none" x-text="detail.doc_no"></span>
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium"
                  :class="kindClass(detail.kind)">
              <span class="w-1.5 h-1.5 rounded-full" :class="qiKindDot(detail.kind)"></span>
              <span x-text="kindLabel(detail.kind)"></span>
            </span>
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium capitalize"
                  :class="statusClass(detail.status)">
              <span class="w-1.5 h-1.5 rounded-full" :class="qiStatusDot(detail.status)"></span>
              <span x-text="detail.status"></span>
            </span>
          </div>
          <div class="text-xs text-slate-500 mt-1.5"
               x-text="[detail.customer_name, detail.customer_code, fmtDate(detail.doc_date)].filter(Boolean).join(' · ')"></div>
        </div>
        <div class="w-full flex flex-wrap items-center justify-end gap-2">
          <button @click="print(detail)"
                  class="bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg shadow-sm
                         px-3 py-2 text-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600/40">
            Print / Save as PDF
          </button>
          <button @click="exportPaper()" :disabled="busy"
                  title="The export-format document this one prints as"
                  class="border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 rounded-lg px-3 py-2 text-sm font-medium shadow-sm transition-colors">Export paper</button>
          <button @click="editDoc()"
                  class="border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 rounded-lg px-3 py-2 text-sm font-medium shadow-sm transition-colors">Edit</button>
          <button @click="reviseDoc()" :disabled="busy" x-show="!detail.superseded_by"
                  title="A new draft keeping this number, with a revision marker"
                  class="border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 rounded-lg px-3 py-2 text-sm font-medium shadow-sm transition-colors">Revise</button>
          <button @click="remove(detail)"
                  class="border border-rose-200 bg-white hover:bg-rose-50 text-rose-600 rounded-lg px-3 py-2 text-sm font-medium shadow-sm transition-colors">Delete</button>
          <button @click="closeDetail()" class="text-slate-400 hover:text-slate-600 px-1 text-xl leading-none transition-colors">✕</button>
        </div>
      </div>

      <!-- the revision chain: active highlighted, superseded dimmed -->
      <template x-if="revRail.length">
        <div class="px-6 py-3 border-b border-slate-200 flex items-center gap-2 flex-wrap">
          <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mr-1">Revisions</div>
          <template x-for="(r, i) in revRail" :key="r.id">
            <span class="flex items-center gap-2">
              <span x-show="i > 0" class="text-slate-300">→</span>
              <button @click="open(r.id)"
                      class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-mono transition-colors"
                      :class="r.id === detail.id
                              ? 'bg-slate-900 text-white'
                              : (r.active ? 'bg-white text-brand-700 ring-1 ring-slate-200 hover:bg-brand-50'
                                          : 'bg-slate-50 text-slate-400 ring-1 ring-slate-200')">
                <span x-text="r.doc_no"></span>
                <!-- a superseded parent keeps its own status (it may well have
                     been sent) — the rail says what the LIST says: replaced -->
                <span x-show="!r.superseded" class="opacity-60" x-text="r.status"></span>
                <span x-show="r.superseded"
                      class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-sans font-medium
                             bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-600/20">
                  <span class="w-1 h-1 rounded-full bg-amber-500"></span>superseded
                </span>
              </button>
            </span>
          </template>
        </div>
      </template>

      <div class="px-6 py-3 bg-slate-50 border-b border-slate-200 flex items-center gap-2 flex-wrap">
        <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mr-1">Mark as</div>
        <template x-for="s in refs.statuses" :key="s">
          <button @click="setStatus(detail, s)"
                  class="px-3 py-1.5 rounded-lg text-xs font-medium border capitalize shadow-sm transition-colors"
                  :class="s === detail.status ? 'bg-brand-600 text-white border-brand-600' : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-50'"
                  x-text="s"></button>
        </template>
      </div>

      <div class="p-6 space-y-4">
        <div>
          <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-2">Lines</div>
          <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-slate-50 border-b-2 border-slate-200">
                  <tr class="text-left text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                    <th class="px-4 py-2.5">Part / description</th>
                    <th class="px-3 py-2.5 text-right">Qty</th>
                    <th class="px-3 py-2.5">Unit</th>
                    <th class="px-3 py-2.5 text-right">Rate</th>
                    <th class="px-3 py-2.5 text-right">Amount</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <template x-for="l in detail.lines" :key="l.id">
                    <tr class="even:bg-slate-50/60">
                      <td class="px-4 py-2.5">
                        <div class="font-medium text-slate-800" x-text="l.drawing_no ? (l.drawing_no + ' rev ' + l.revision) : l.description"></div>
                        <div x-show="l.drawing_no && l.description" class="text-xs text-slate-400" x-text="l.description"></div>
                      </td>
                      <td class="px-3 py-2.5 text-right tabular-nums text-slate-600" x-text="l.qty"></td>
                      <td class="px-3 py-2.5 text-slate-400" x-text="l.unit"></td>
                      <td class="px-3 py-2.5 text-right tabular-nums text-slate-600" x-text="qiRate(l.rate, qiSym(detail))"></td>
                      <td class="px-3 py-2.5 text-right tabular-nums font-semibold text-slate-900" x-text="money(l.amount, qiSym(detail))"></td>
                    </tr>
                  </template>
                </tbody>
                <tfoot>
                  <tr class="bg-slate-50 border-t-2 border-slate-200">
                    <td colspan="4" class="px-4 py-2 text-right text-xs uppercase tracking-wider font-semibold text-slate-500">Subtotal</td>
                    <td class="px-3 py-2 text-right tabular-nums text-slate-700" x-text="money(detail.subtotal, qiSym(detail))"></td>
                  </tr>
                  <tr class="bg-slate-50" x-show="detail.tax_pct">
                    <td colspan="4" class="px-4 py-2 text-right text-xs uppercase tracking-wider font-semibold text-slate-500"
                        x-text="'GST @ ' + detail.tax_pct + '%'"></td>
                    <td class="px-3 py-2 text-right tabular-nums text-slate-700" x-text="money(detail.tax, qiSym(detail))"></td>
                  </tr>
                  <tr class="bg-slate-50 border-t border-slate-200">
                    <td colspan="4" class="px-4 py-2.5 text-right text-sm font-semibold text-slate-900">Total</td>
                    <td class="px-3 py-2.5 text-right tabular-nums text-base font-bold text-slate-900" x-text="money(detail.total, qiSym(detail))"></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>

        <div x-show="detail.reference || detail.valid_until || detail.order_no || detail.notes"
             class="rounded-xl border border-slate-200 bg-white shadow-sm px-4 py-3">
          <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-2">Details</div>
          <dl class="grid grid-cols-3 gap-x-4 gap-y-2">
            <div x-show="detail.reference">
              <dt class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Reference</dt>
              <dd class="text-sm text-slate-700" x-text="detail.reference"></dd>
            </div>
            <div x-show="detail.valid_until">
              <dt class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Valid until</dt>
              <dd class="text-sm text-slate-700 tabular-nums" x-text="fmtDate(detail.valid_until)"></dd>
            </div>
            <div x-show="detail.order_no">
              <dt class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Against order</dt>
              <dd class="font-mono text-xs text-slate-600" x-text="detail.order_no"></dd>
            </div>
          </dl>
          <div x-show="detail.notes" class="mt-3 pt-3 border-t border-slate-100">
            <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Notes</div>
            <div class="text-sm text-slate-600 whitespace-pre-line" x-text="detail.notes"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </template>

  <!-- ============================= FORM ============================= -->
  <!-- ONE set of fields, two surfaces: ADDING renders it as a full page
       (z-[60], like the costing workspace), EDITING as the usual modal.
       Same markup either way, so the two can never drift apart. -->
  <template x-if="form">
  <div :class="addPage ? 'fixed inset-0 z-[60] bg-slate-100 overflow-auto'
                       : 'fixed inset-0 z-50 bg-slate-900/50 flex items-start justify-center p-4 overflow-auto'">
    <div :class="addPage ? 'min-h-full w-full'
                         : 'bg-white rounded-2xl shadow-2xl w-full max-w-3xl my-6 overflow-hidden'">
      <div class="px-6 py-4"
           :class="addPage ? 'bg-slate-900 text-white sticky top-0 z-10 shadow-sm' : 'border-b border-slate-200'">
        <div class="flex items-center gap-3 w-full" :class="addPage ? 'max-w-5xl mx-auto' : ''">
          <button x-show="addPage" @click="closeForm()"
                  class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-lg px-3 py-2 text-sm font-medium transition-colors">
            <span class="text-base leading-none">←</span> Back
          </button>
          <div>
            <div x-show="addPage" class="text-[10px] uppercase tracking-[0.18em] text-slate-500 font-semibold leading-none">Apex Thermocon</div>
            <div class="text-lg font-bold leading-tight" :class="addPage ? 'mt-1' : ''"
                 x-text="(form.id ? 'Edit ' : 'New ') + kindLabel(form.kind).toLowerCase()"></div>
          </div>
          <button x-show="!addPage" @click="closeForm()"
                  class="ml-auto text-slate-400 hover:text-slate-600 px-2 text-xl leading-none transition-colors">✕</button>
        </div>
      </div>

      <form @submit.prevent="save()"
            :class="addPage ? 'max-w-5xl mx-auto w-full p-6 pb-12 space-y-4 text-sm' : 'p-6 space-y-4 text-sm'">

        <div x-show="!form.id" class="rounded-xl border border-slate-200 bg-white shadow-sm p-4">
          <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-2">Start from an order</div>
          <select @change="fromOrder($event.target.value)"
                  title="Fills the customer, the reference and the lines from that order"
                  class="w-full max-w-md border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white
                         focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
            <option value="">— start empty —</option>
            <template x-for="o in refs.orders" :key="o.id">
              <option :value="o.id" x-text="o.order_no + ' · ' + o.customer_name"></option>
            </template>
          </select>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white shadow-sm p-4">
          <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold mb-3">Document</div>
          <div class="grid grid-cols-4 gap-3">
            <div class="col-span-2">
              <label class="block text-xs font-medium text-slate-500 mb-1">Customer *</label>
              <select x-model="form.customer_id" x-effect="form.customer_id && $nextTick(() => $el.value = form.customer_id)"
                      class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white
                             focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
                <option value="">—</option>
                <template x-for="c in refs.customers" :key="c.id">
                  <option :value="c.id" x-text="(c.code ? c.code + ' · ' : '') + c.name"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Date</label>
              <input type="date" x-model="form.doc_date"
                     class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white tabular-nums
                            focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
            </div>
            <div x-show="form.kind === 'quotation'">
              <label class="block text-xs font-medium text-slate-500 mb-1">Valid until</label>
              <input type="date" x-model="form.valid_until"
                     class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white tabular-nums
                            focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-medium text-slate-500 mb-1">Reference</label>
              <input x-model="form.reference" placeholder="Their enquiry / PO"
                     class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white
                            focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">GST %</label>
              <input type="number" min="0" step="0.5" x-model="form.tax_pct"
                     class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white text-right tabular-nums
                            focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
            </div>
          </div>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
          <div class="px-4 py-3 text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Lines</div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 border-y-2 border-slate-200">
                <tr class="text-left text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                  <th class="px-4 py-2.5 w-1/4">Drawing</th>
                  <th class="px-2 py-2.5">Description</th>
                  <th class="px-2 py-2.5 w-24 text-right">Qty</th>
                  <th class="px-2 py-2.5 w-24">Unit</th>
                  <th class="px-2 py-2.5 w-32 text-right">Rate</th>
                  <th class="px-2 py-2.5 w-10"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <template x-for="(l, i) in form.lines" :key="i">
                  <tr class="even:bg-slate-50/60">
                    <td class="px-4 py-2">
                      <select x-model="l.drawing_id" x-effect="l.drawing_id && $nextTick(() => $el.value = l.drawing_id)"
                              @change="linePicked(l)"
                              class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white
                                     focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
                        <option value="">(no drawing)</option>
                        <template x-for="d in refs.drawings" :key="d.id">
                          <option :value="d.id" x-text="d.drawing_no + ' rev ' + d.revision"></option>
                        </template>
                      </select>
                    </td>
                    <td class="px-2 py-2">
                      <input x-model="l.description" placeholder="Description"
                             class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white
                                    focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
                    </td>
                    <td class="px-2 py-2">
                      <input type="number" min="0" step="0.01" x-model="l.qty" placeholder="0"
                             class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white text-right tabular-nums
                                    focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
                    </td>
                    <td class="px-2 py-2">
                      <input x-model="l.unit" list="unitlist" placeholder="Unit"
                             class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white
                                    focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
                    </td>
                    <td class="px-2 py-2">
                      <input type="number" min="0" step="0.001" x-model="l.rate" placeholder="₹ rate"
                             title="Unit rates carry three decimals (£0.534)"
                             class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white text-right tabular-nums
                                    focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
                    </td>
                    <td class="px-2 py-2 text-right">
                      <button type="button" @click="removeLine(i)" title="Remove line"
                              class="text-slate-300 hover:text-rose-600 transition-colors">✕</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="px-4 py-2.5 border-t border-slate-200 bg-slate-50">
            <button type="button" @click="addLine()" class="text-xs font-medium text-brand-700 hover:underline">+ Add line</button>
          </div>
        </div>
        <datalist id="unitlist">
          <template x-for="u in refs.units" :key="u"><option :value="u"></option></template>
        </datalist>

        <div class="grid grid-cols-3 gap-4 items-start">
          <div class="col-span-2 rounded-xl border border-slate-200 bg-white shadow-sm p-4 space-y-3">
            <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Notes &amp; terms</div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1">Notes</label>
              <textarea x-model="form.notes" rows="2"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white
                               focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition"></textarea>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1" title="Printed at the bottom of the document">Terms</label>
              <textarea x-model="form.terms" rows="3"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white
                               focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition"></textarea>
            </div>
          </div>

          <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Totals</div>
            <table class="w-full text-sm">
              <tbody class="divide-y divide-slate-100">
                <tr>
                  <td class="px-4 py-2 text-slate-500">Subtotal</td>
                  <td class="px-4 py-2 text-right tabular-nums text-slate-700" x-text="money(formTotals.subtotal)"></td>
                </tr>
                <tr>
                  <td class="px-4 py-2 text-slate-500" x-text="'GST @ ' + (form.tax_pct || 0) + '%'"></td>
                  <td class="px-4 py-2 text-right tabular-nums text-slate-700" x-text="money(formTotals.tax)"></td>
                </tr>
              </tbody>
              <tfoot>
                <tr class="bg-slate-50 border-t-2 border-slate-200">
                  <td class="px-4 py-2.5 font-semibold text-slate-900">Total</td>
                  <td class="px-4 py-2.5 text-right tabular-nums font-bold text-slate-900" x-text="money(formTotals.total)"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>

        <!-- ============ OPTIONAL: material availability ============
             Off by default and entirely advisory. Ticking it does not change
             the quotation, block the Save button, or reserve any stock — it
             answers "could we actually make this?" before you commit. -->
        <div class="rounded-xl border bg-white shadow-sm transition-colors" :class="checkOn ? 'border-brand-600' : 'border-slate-200'">
          <label class="flex items-center gap-3 px-4 py-3 cursor-pointer"
                 title="Advisory only — nothing is reserved and the quotation is unchanged">
            <input type="checkbox" :checked="checkOn" @change="toggleCheck()" class="w-4 h-4 accent-brand-600" />
            <span class="font-medium text-slate-700">Check material availability</span>
            <template x-if="chkResult">
              <span class="ml-auto inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium"
                    :class="availClass(chkResult?.status)">
                <span class="w-1.5 h-1.5 rounded-full" :class="qiAvailDot(chkResult?.status)"></span>
                <span x-text="availLabel(chkResult?.status) + ' · ' + chkResult?.total_feasible + ' makeable'"></span>
              </span>
            </template>
          </label>

          <div x-show="checkOn" x-cloak class="px-4 pb-4 border-t border-slate-200 pt-4">
            <div class="inline-flex items-center gap-0.5 bg-white border border-slate-200 rounded-xl p-1 shadow-sm mb-3">
              <button type="button" @click="chk.method='dimension'; chkResult=null"
                      class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors"
                      :class="chk.method==='dimension' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'">
                By dimension</button>
              <button type="button" @click="chk.method='quantity'; chkResult=null"
                      class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors"
                      :class="chk.method==='quantity' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'">
                By quantity</button>
            </div>

            <div class="grid grid-cols-3 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Material</label>
                <select x-model="chk.material_class"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white
                               focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
                  <option value="">Any</option>
                  <template x-for="o in chkRefs.material_class" :key="o"><option :value="o" x-text="o"></option></template>
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Grade</label>
                <select x-model="chk.grade"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white
                               focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
                  <option value="">Any</option>
                  <template x-for="o in chkRefs.grade" :key="o"><option :value="o" x-text="o"></option></template>
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Parts required</label>
                <input x-model="chk.required_qty" type="number" min="0" step="1"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white text-right tabular-nums
                              focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
              </div>
            </div>

            <div class="grid grid-cols-3 gap-3 mt-3" x-show="chk.method==='dimension'">
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Part length *</label>
                <input x-model="chk.part_length" type="number" min="0" step="0.01"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white text-right tabular-nums
                              focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Part diameter</label>
                <input x-model="chk.part_diameter" type="number" min="0" step="0.01"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white text-right tabular-nums
                              focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Tolerance / margin</label>
                <input x-model="chk.margin" type="number" min="0" step="0.01"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white text-right tabular-nums
                              focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition" />
              </div>
            </div>

            <button type="button" @click="runCheck()" :disabled="chkBusy"
                    class="mt-3 bg-slate-800 hover:bg-slate-900 disabled:opacity-50 text-white font-semibold rounded-lg shadow-sm
                           px-4 py-2 text-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/30"
                    x-text="chkBusy ? 'Checking…' : 'Check stock'"></button>

            <template x-if="chkResult">
              <div class="mt-4 rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
                <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center gap-5 flex-wrap">
                  <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Availability</div>
                  <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium"
                        :class="availClass(chkResult?.status)">
                    <span class="w-1.5 h-1.5 rounded-full" :class="qiAvailDot(chkResult?.status)"></span>
                    <span x-text="availLabel(chkResult?.status)"></span>
                  </span>
                  <span class="text-xs text-slate-400">Need
                    <b class="ml-1 tabular-nums text-sm text-slate-900" x-text="chkResult?.requirement.required_qty"></b></span>
                  <span class="text-xs text-slate-400">Can make
                    <b class="ml-1 tabular-nums text-sm text-emerald-700" x-text="chkResult?.total_feasible"></b></span>
                  <span class="text-xs text-slate-400" x-show="chkResult?.shortfall > 0">Short by
                    <b class="ml-1 tabular-nums text-sm text-rose-700" x-text="chkResult?.shortfall"></b></span>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-xs">
                    <thead class="bg-slate-50 border-b-2 border-slate-200">
                      <tr class="text-left text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                        <th class="px-3 py-2">Heat</th>
                        <th class="px-3 py-2 text-right">Length</th>
                        <th class="px-3 py-2 text-right">Ø</th>
                        <th class="px-3 py-2 text-right">Pieces</th>
                        <th class="px-3 py-2 text-right">Parts/piece</th>
                        <th class="px-3 py-2 text-right">Parts</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      <template x-for="r in checkRows()" :key="r.key">
                        <tr class="even:bg-slate-50/60" :class="r.piece && !r.piece.parts ? 'text-slate-300' : 'text-slate-600'">
                          <td class="px-3 py-1.5 font-mono font-semibold"
                              :class="r.piece && r.piece.parts ? 'text-brand-700' : 'text-slate-400'"
                              x-text="r.first ? r.heat.heat_number : ''"></td>
                          <td class="px-3 py-1.5 text-right tabular-nums" :class="r.piece ? '' : 'text-slate-300'"
                              x-text="r.piece ? dim(r.piece.length_mm) : '—'"></td>
                          <td class="px-3 py-1.5 text-right tabular-nums" :class="r.piece ? '' : 'text-slate-300'"
                              x-text="r.piece ? dim(r.piece.diameter_mm) : '—'"></td>
                          <td class="px-3 py-1.5 text-right tabular-nums" x-text="r.piece ? r.piece.available : r.heat.rods_remaining"></td>
                          <td class="px-3 py-1.5 text-right tabular-nums"
                              :class="!r.piece || r.piece.parts_per_piece === null ? 'text-slate-300' : ''"
                              x-text="!r.piece || r.piece.parts_per_piece === null ? '—' : r.piece.parts_per_piece"></td>
                          <td class="px-3 py-1.5 text-right tabular-nums font-semibold"
                              :class="r.piece && r.piece.parts ? 'text-slate-900' : 'text-slate-300'"
                              x-text="r.piece ? r.piece.parts : 0"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
                <div class="px-4 py-2 border-t border-slate-200 bg-slate-50 text-[11px] text-slate-400">
                  Advisory — nothing is reserved and the quotation is unchanged.
                </div>
              </div>
            </template>
          </div>
        </div>

        <p x-show="formError" x-text="formError"
           class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700"></p>
        <div class="flex items-center gap-3">
          <button type="submit"
                  class="bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg shadow-sm px-5 py-2.5 text-sm transition-colors
                         focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600/40"
                  x-text="'Save ' + kindLabel(form.kind).toLowerCase()"></button>
          <button type="button" @click="closeForm()"
                  class="border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 rounded-lg px-4 py-2.5 text-sm font-medium shadow-sm transition-colors">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  </template>

</body>
</html>
